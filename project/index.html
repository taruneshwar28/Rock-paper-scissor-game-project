<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <header><h1>Rock Paper Scissor</header>
    <div class="score-board">
        <div id="user-label" class="badge">user</div>
        <div id="comp-label" class="badge">comp</div>
        <span id="user-score">0</span>:<span id="comp-score">0</span>
    </div>
    <div class="result"><p>Paper covers rock.You win!</p></div>
    <div class="choices">
        <div class="choice" id="r"><img src="images (1).jpeg" ></div>
        <div class="choice" id="p"><img src="image 3.jpeg" ></div>
        <div class="choice" id="s"><img src="images (2).jpeg" ></div>
        </div>
    <div class="action-message">Make Your Move</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
